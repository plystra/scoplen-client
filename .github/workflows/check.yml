name: check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      # The Tauri context embeds the built frontend at compile time.
      - name: Build frontend
        run: pnpm --filter @scoplen/app build
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets

  dependencies:
    name: Rust dependencies
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cargo-deny and cargo-machete
        run: cargo install --locked cargo-deny@0.20.2 cargo-machete@0.9.2
      - name: Licenses, advisories, bans, and sources
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm license-check

  app:
    name: Build and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: pnpm tauri build --bundles app
            binary: target/release/bundle/macos/Scoplen.app/Contents/MacOS/scoplen
          - os: windows-latest
            build: pnpm tauri build --bundles nsis
            binary: target/release/scoplen.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: ${{ matrix.build }}
      - name: Launch until the first screen renders
        shell: bash
        env:
          SPL_SMOKE_TEST: "1"
        run: ${{ matrix.binary }}
